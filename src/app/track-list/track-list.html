@if (auth.isLoggedIn()) {
  <a routerLink="/tracks/new" class="btn-add">Ajouter</a>
}
<input
  type="search"
  placeholder="Rechercher un titre ou un artiste…"
  [value]="searchTerm()"
  (input)="searchTerm.set($any($event.target).value)" />

<section class="grid">
@for (track of filteredTracks(); track track.id) {
  <app-track-card
    [track]="track"
    [active]="track.id === selectedId()"
    [showFavorite]="featFavorites && auth.isLoggedIn()"
    (select)="selectedId.set($event.id)"
    (favoriteToggle)="onFavoriteToggle($event)" />
} @empty {
  <p class="empty">{{ searchTerm() ? 'Aucun résultat pour « ' + searchTerm() + ' ».' : 'Aucun morceau.' }}</p>
}
</section>
